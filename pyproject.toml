[project]
name = "alpaca-portfolio-hedging"
version = "1.0.0"
description = "Autonomous AI Portfolio Hedging System with ForecastAgent, FinRL-X, and Vibe-Trading Options Lab for Alpaca AI Trading Agents Hackathon"
authors = [
    { name = "ShinyDataTech", email = "developer@shinydata.tech" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.38.0",
    "mcp>=1.3.0",
    "fastmcp>=0.4.1",
    "uvicorn>=0.34.0",
    "torch>=2.2.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "stockstats>=0.6.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "scipy>=1.13.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "training"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]
